name: Ci CD Pipeline

on:
    push:
        branches:
            - feature/**
        paths-ignore:
            - 'docs/**'
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Extract Environment from Branch Name
              run: |
                  if [[ "${GITHUB_REF#refs/heads/}" == feature/* ]]; then
                     echo "ENVIRONMENT=feature-${GITHUB_REF#refs/heads/feature/}" >> $GITHUB_ENV
                  fi
            - name: Build Docker Image
              run: |
                  docker build -t 19910821/customer-service:${{github.sha}} .
                  docker tag 19910821/customer-service:${{github.sha}}  19910821/customer-service:$ENVIRONMENT-${{github.sha}} .
